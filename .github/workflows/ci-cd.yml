name: CI CD

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit Test
        run: npm test -- --runInBand

      - name: E2E Test
        run: npm run test:e2e -- --runInBand
        env:
          JWT_SECRET: test-jwt-secret
          ADMIN_JWT_SECRET: test-admin-secret
          AI_API_URL: http://127.0.0.1:7860
          S3_ACCESS_KEY: test-access-key
          S3_SECRET_KEY: test-secret-key

      - name: Build
        run: npm run build

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_WS_URL: ws://localhost:3001

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set App Version
        run: echo "APP_VERSION=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker build --build-arg APP_VERSION=${APP_VERSION} -t phantomdraw/backend:${APP_VERSION} ./backend

      - name: Build frontend image
        run: docker build --build-arg APP_VERSION=${APP_VERSION} -t phantomdraw/frontend:${APP_VERSION} ./frontend

  release:
    name: Release Bundle
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release package
        run: |
          mkdir -p release
          cp docker-compose.yml release/
          cp -R ops release/
          cp DEPLOYMENT.md DEPLOYMENT_CN.md release/
          tar -czf phantomdraw-release-${GITHUB_SHA::12}.tar.gz release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantomdraw-release-${{ github.sha }}
          path: phantomdraw-release-*.tar.gz
