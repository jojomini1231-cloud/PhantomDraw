global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: phantomdraw-backend
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - backend:3008

  - job_name: phantomdraw-frontend
    metrics_path: /
    static_configs:
      - targets:
          - frontend:3000

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
